line-length = 110
target-version = "py312"

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# FastAPI's File(...) default is idiomatic; broad catches are deliberate at
# external-service/PDF boundaries and are logged or converted to stable codes.
# RUF001-003 flag Chinese full-width punctuation as "ambiguous"; this project
# intentionally uses Chinese punctuation in user-facing text.
ignore = ["E501", "B008", "BLE001", "RUF001", "RUF002", "RUF003", "RUF009", "RUF012", "ISC004", "S112"]

[lint.per-file-ignores]
# conftest intentionally configures the environment before importing the app.
"tests/conftest.py" = ["E402"]

