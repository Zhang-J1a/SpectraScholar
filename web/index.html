<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SpectraScholar — Research Agent</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1220; --panel:#111c2e; --border:#263954; --text:#ecf3ff; --muted:#a4b7cc; --accent:#67c8b9; }
    * { box-sizing:border-box; }
    body { margin:0; background:radial-gradient(circle at 80% 0%,#183b48,transparent 45%),var(--bg); color:var(--text); font:15px/1.65 system-ui,'Microsoft YaHei',sans-serif; }
    header { max-width:1100px; margin:auto; padding:38px 24px 20px; }
    .brand { letter-spacing:.18em; font-size:11px; font-weight:700; color:var(--accent); }
    h1 { font-size:38px; line-height:1.2; margin:10px 0; }
    h2 { font-size:18px; margin:0 0 16px; }
    p { color:var(--muted); margin:6px 0 12px; }
    .tag { background:#21433e; padding:5px 9px; border-radius:7px; color:#bff8e9; display:inline-block; font-size:12px; margin-top:12px; }
    main { display:grid; grid-template-columns:1.12fr 1fr; gap:18px; max-width:1100px; padding:14px 24px 45px; margin:auto; }
    section { padding:24px; border:1px solid var(--border); border-radius:16px; background:var(--panel); min-width:0; }
    .wide { grid-column:1 / -1; }
    label { display:block; margin:10px 0 5px; font-size:13px; color:#c4d6e9; }
    textarea,select,input[type=file] { background:#0a1626; color:var(--text); width:100%; border:1px solid #37516d; border-radius:8px; font:inherit; padding:10px 12px; }
    textarea { min-height:110px; resize:vertical; }
    .controls { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    button { background:var(--accent); border:0; border-radius:8px; color:#062923; font:inherit; font-weight:700; padding:10px 17px; cursor:pointer; margin-top:14px; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .secondary { background:#263e54; color:#e4f1ff; }
    pre { overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; background:#081321; color:#c9dae9; padding:18px; border-radius:10px; max-height:490px; }
    .status { font-size:12px; color:var(--accent); margin:12px 0; min-height:16px; }
    .paper { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid #24374b; }
    .paper span { overflow-wrap:anywhere; }
    a { color:#8fd8fc; }
    small { color:var(--muted); }
    @media(max-width:750px){main{grid-template-columns:1fr}.wide{grid-column:auto} h1{font-size:30px}}
  </style>
</head>
<body>
  <header>
    <div class="brand">SPECTRASCHOLAR / RESEARCH INTELLIGENCE</div>
    <h1>让文献研究变成<br>可复查的工作流</h1>
    <p>研究任务 · 论文知识库 · 原文证据验证 · 跨论文比较</p>
    <div id="mode" class="tag">正在读取运行模式</div>
  </header>
  <main>
    <section>
      <h2>01 / 创建研究任务</h2>
      <label for="topic">研究问题</label>
      <textarea id="topic">比较 2024 年以来图神经网络在高光谱图像分类中的应用，重点分析动态图构建与实验评估。</textarea>
      <div class="controls">
        <div><label for="domain">领域</label><select id="domain"><option value="hyperspectral">高光谱分类</option><option value="general">通用科研</option></select></div>
        <div><label for="source">资料来源</label><select id="source"><option value="web">网络研究</option><option value="local">本地论文</option></select></div>
      </div>
      <button id="run">开始研究</button>
      <div id="researchStatus" class="status"></div>
      <div id="reportLink"></div>
    </section>
    <section>
      <h2>02 / 论文资料管理</h2>
      <p>上传 PDF 后可以选择两篇以上文献进行结构化证据比较。不同来源的指标不应直接混为同一实验条件。</p>
      <label for="pdf">添加论文 PDF</label>
      <input id="pdf" type="file" accept=".pdf,application/pdf" multiple />
      <button id="upload" class="secondary">上传论文</button>
      <div id="uploadStatus" class="status"></div>
      <div id="papers"></div>
      <button id="compare" class="secondary">比较选中论文</button>
      <div id="compareStatus" class="status"></div>
    </section>
    <section class="wide">
      <h2>03 / 研究结果与证据</h2>
      <p>研究报告与论文比较结果会显示在此。离线演示模式不会伪造在线检索结果。</p>
      <pre id="output">尚未开始研究。</pre>
      <small>提示：这是可独立修改的个人项目模板。真实部署应补充用户权限、任务队列与质量评测。</small>
    </section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const sleep = ms => new Promise(resolve => setTimeout(resolve,ms));
    async function api(url,options={}) {
      const response=await fetch(url,options);
      const body=await response.json().catch(()=>({detail:'请求失败'}));
      if(!response.ok) throw new Error(typeof body.detail==='string'?body.detail:JSON.stringify(body.detail));
      return body;
    }
    async function refreshStatus(){
      try { const h=await api('/api/v1/health'); $('mode').textContent=`研究引擎：${h.research_backend} / 抽取模式：${h.extractor_backend}`; }
      catch(e){$('mode').textContent='服务未连接：'+e.message;}
    }
    async function refreshDocs(){
      const docs=await api('/api/v1/documents'); const root=$('papers');root.replaceChildren();
      if(!docs.length){const p=document.createElement('p');p.textContent='暂无论文';root.append(p);return;}
      for(const d of docs){const row=document.createElement('label');row.className='paper';const ck=document.createElement('input');ck.type='checkbox';ck.value=d.document_id; const span=document.createElement('span');span.textContent=`${d.filename} (${Math.ceil(d.size/1024)} KB)`;row.append(ck,span);root.append(row);}
    }
    $('run').onclick=async()=>{
      $('run').disabled=true;$('researchStatus').textContent='提交中...';$('reportLink').replaceChildren();
      try{
        const req={topic:$('topic').value,source:$('source').value,domain:$('domain').value,language:'zh'};
        const job=await api('/api/v1/research',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(req)});
        $('researchStatus').textContent='任务已提交：'+job.job_id;
        let done=false;
        for(let i=0;i<120;i++){
          await sleep(1500);const info=await api('/api/v1/research/'+job.job_id);
          $('researchStatus').textContent='状态：'+info.status;
          if(info.status==='completed'){
            $('output').textContent=info.report;
            const link=document.createElement('a');link.href='/api/v1/reports/'+job.job_id+'.md';link.textContent='下载 Markdown 报告';$('reportLink').append(link);done=true;break;
          }
          if(info.status==='failed')throw new Error(info.error || '任务执行失败');
        }
        if(!done) $('researchStatus').textContent='仍在执行，可通过任务 ID 查询状态：'+job.job_id;
      }catch(e){$('researchStatus').textContent='研究失败：'+e.message}
      finally{$('run').disabled=false;}
    };
    $('upload').onclick=async()=>{
      $('upload').disabled=true; $('uploadStatus').textContent='上传中...';
      try{
        const files=$('pdf').files;if(!files.length)throw new Error('请选择 PDF 文件');
        for(const f of files){const form=new FormData();form.append('file',f);await api('/api/v1/documents',{method:'POST',body:form});}
        $('uploadStatus').textContent=`成功上传 ${files.length} 个文件`;await refreshDocs();
      }catch(e){$('uploadStatus').textContent='上传失败：'+e.message}
      finally{$('upload').disabled=false;}
    };
    $('compare').onclick=async()=>{
      $('compare').disabled=true;$('compareStatus').textContent='正在抽取并核对原文证据...';
      try{
        const ids=[...document.querySelectorAll('#papers input:checked')].map(el=>el.value);
        if(ids.length<2||ids.length>5)throw new Error('请选择 2～5 篇论文');
        const result=await api('/api/v1/compare',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({document_ids:ids})});
        $('output').textContent=JSON.stringify(result,null,2);
        $('compareStatus').textContent='已生成有出处的结构化对比数据';
      }catch(e){$('compareStatus').textContent='比较失败：'+e.message}
      finally{$('compare').disabled=false;}
    };
    refreshStatus();refreshDocs().catch(e=>{$('uploadStatus').textContent=e.message});
  </script>
</body>
</html>
